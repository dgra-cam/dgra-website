baseURL: 'https://dgra.cam/'
languageCode: 'en-gb'
timeZone: 'Europe/London'
title: DGRA
module:
  proxy: "direct"
  imports:
    path: "github.com/google/docsy"

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true

params:
  copyright: 'Darwin Green Residents’ Association'

  # Repository configuration (URLs for in-page links to opening issues and suggesting changes)
  github_repo: 'https://github.com/dgra-cam/dgra-website'

  # Enable Algolia DocSearch
  search.algolia: false

  # Enable Lunr.js offline search
  offlineSearch: true

  # User interface configuration
  ui:
    # Set to true to disable breadcrumb navigation.
    breadcrumb_disable: true
    # Set to true to enable the About link in the site footer
    footer_about_enable: true

    showLightDarkModeMenu: true

  links:
    # End user relevant links. These will show up on left side of footer and in the community page if you have one.
    user:
    - name: 'RSS feed'
      url: '/blog/index.xml'
      icon: 'fas fa-rss'
      desc: 'RSS feed for blog posts on this website'

    - name: 'Darwin Green Construction Updates'
      url: 'https://darwingreenconstruction.co.uk/latest-updates/'
      icon: 'fa fa-link'
      desc: "Builder's updates website"

    - name: 'Darwin Green PLAZA group on Facebook'
      url: 'https://www.facebook.com/groups/dgplaza/'
      icon: 'fab fa-facebook'
      desc: 'Darwin Green PLAZA community group on Facebook'

    - name: 'DGRA Facebook page'
      url: 'https://www.facebook.com/DarwinGreenCambridge/'
      icon: 'fab fa-square-facebook'
      desc: 'DGRA page on Facebook'

    - name: 'DGRA on Instagram'
      url: 'https://www.instagram.com/darwingreencambridge'
      icon: 'fab fa-instagram'
      desc: 'DGRA X/Twitter account'

    - name: 'DGRA on X/Twitter'
      url: 'https://x.com/darwingreencam'
      icon: 'fab fa-x-twitter'
      desc: 'DGRA X/Twitter account'

    - name: 'WhatsApp community group (restricted access, contact us)'
      url: '/docs/practical/community/#whatsapp'
      icon: 'fab fa-whatsapp'
      desc: "Darwin Green's community chat group on WhatsApp (access is subject to admin approval)"

    # Developer relevant links. These will show up on right side of footer and in the community page if you have one.
    developer:
    - name: 'GitHub repository'
      url: 'https://github.com/dgra-cam/dgra-website'
      icon: 'fab fa-github'
      desc: 'GitHub repository for this site'

    - name: 'Analytics dashboard'
      url: 'https://dashboard.simpleanalytics.com/dgra.cam'
      icon: 'fa fa-chart-line'
      desc: 'Simple Analytics public dashboard for this site'

  taxonomy:
    # Empty value to disable categories/tags cloud in right sidebar
    taxonomyCloud:
    -

menu:
  main:
    - name: Home
      url: '/'
      weight: 1
    - name: Blog
      url: '/blog/'
      weight: 10
    - name: Knowledge Base
      url: '/docs/'
      weight: 20
    - name: About
      url: '/about/'
      weight: 30
    - name: Contact
      url: '/contact/'
      weight: 40
